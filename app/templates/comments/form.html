{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h2>{{ title }}</h2>
<form method="post">
    {% csrf_token %}
    <textarea name="content" rows="3">{{ comment.content }}</textarea>
    <button type="submit">Save</button>
</form>
<a href="{% url 'post-detail-page' comment.post.id %}">Cancel</a>
{% endblock %}
